<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F5"/>
      <stop offset="100%" stop-color="#E8ECE7"/>
    </linearGradient>
    <radialGradient id="glow" cx="63%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#176B61" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#E8ECE7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screenClip">
      <rect x="34.5" y="36" width="25" height="33.5" rx="2"/>
    </clipPath>
  </defs>

  <!-- Bright Paper Adaptive Background matching app theme -->
  <rect width="108" height="108" fill="url(#bg)"/>
  <rect width="108" height="108" fill="url(#glow)"/>

  <!-- Card Soft Shadow -->
  <rect x="32.4" y="33.8" width="32" height="44" rx="4" fill="#17302A" fill-opacity="0.14"/>

  <!-- Pure E-Ink Paper Card Shell (centered vertically at y=54) -->
  <rect x="31" y="32" width="32" height="44" rx="3.8" fill="#FFFFFF" stroke="#1E463F" stroke-width="1.2"/>

  <!-- Bottom chin registration pill -->
  <rect x="43" y="72.1" width="8" height="1.5" rx="0.75" fill="#C4CBC7"/>

  <!-- 4-Color E-Ink Viewport -->
  <g clip-path="url(#screenClip)">
    <rect x="34.5" y="36" width="25" height="33.5" fill="#F8F7F1"/>
    <!-- Crimson Red Sun -->
    <circle cx="42.5" cy="45.5" r="4.1" fill="#C82018"/>
    <!-- Warm Yellow Dune -->
    <path d="M 34.5 60 Q 43.5 51.5 54 59 L 59.5 63 L 59.5 69.5 L 34.5 69.5 Z" fill="#F2C900"/>
    <!-- Charcoal Ink Peak -->
    <path d="M 34.5 66.5 L 42.5 60.5 L 47 63 L 53 54 L 59.5 62 L 59.5 69.5 L 34.5 69.5 Z" fill="#171E1B"/>
  </g>
  <rect x="34.5" y="36" width="25" height="33.5" rx="2" fill="none" stroke="#DDE2DC" stroke-width="0.7"/>

  <!-- NFC Emitter & Symmetric Horizontal Forest-Teal Arcs (cy=54, pointing straight right) -->
  <circle cx="62" cy="54" r="3.5" fill="#F3F5F1"/>
  <circle cx="62" cy="54" r="2.0" fill="#176B61"/>
  <path d="M 66.35 49.17 A 6.5 6.5 0 0 1 66.35 58.83" fill="none" stroke="#145C53" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 69.70 45.45 A 11.5 11.5 0 0 1 69.70 62.55" fill="none" stroke="#1F7D71" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 73.04 41.74 A 16.5 16.5 0 0 1 73.04 66.26" fill="none" stroke="#45A396" stroke-width="2.2" stroke-linecap="round"/>
</svg>
